name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Compile the template with many option combinations so that no change
  # breaks any of them.
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            options: "font=sans, secondlanguage=spanish, bibstyle=numeric"
          - name: print, serif, Catalan, author-year, final
            options: "print, final, font=serif, secondlanguage=catalan, bibstyle=authoryear"
          - name: Galician, uppercase, 11pt
            options: "secondlanguage=galician, uppercase, 11pt"
          - name: Basque, American English
            options: "secondlanguage=basque, english=american"
          - name: Valencian, print
            options: "secondlanguage=valencian, print"
          - name: no second language, serif, final
            options: "secondlanguage=none, final, font=serif"
    steps:
      - uses: actions/checkout@v4
      - name: Set class options
        run: |
          python3 - <<'PY'
          import re
          s = open("main.tex", encoding="utf-8").read()
          s = re.sub(r"\\documentclass\[.*?\]\{tfmthesis\}",
                     lambda m: "\\documentclass[${{ matrix.options }}]{tfmthesis}", s, flags=re.S)
          open("main.tex", "w", encoding="utf-8").write(s)
          PY
          grep -A1 documentclass main.tex
      - name: Compile
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
      - name: Check for undefined references and overfull boxes
        run: |
          if grep -E "There were undefined references|Citation .* undefined" main.log; then
            echo "::error::Undefined references or citations"; exit 1
          fi
          grep -E "Overfull" main.log && echo "::warning::Overfull boxes found" || true

  # Build the reference PDF and an Overleaf-ready ZIP; attach both to releases.
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Compile main.pdf and template-guide.pdf
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main.tex
            template-guide.tex
      - name: Package the template
        run: |
          zip -r TFMLatexTemplate.zip \
            main.tex template-guide.tex config.tex tfmthesis.cls references.bib Makefile \
            LICENSE README.md frontmatter chapters appendices figures tables presets \
            -x "*.aux" "*.log"
          unzip -l TFMLatexTemplate.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: TFMLatexTemplate
          path: |
            main.pdf
            template-guide.pdf
            TFMLatexTemplate.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.pdf
            template-guide.pdf
            TFMLatexTemplate.zip
          generate_release_notes: true
